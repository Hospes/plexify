name: Release

# Pushing a semver tag (e.g. 0.2.1) is the whole release. Binaries are built and the
# notes are written in parallel; the GitHub release is created last, with both, so a
# release never appears with missing downloads.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Never cancel a release in progress; a second push of the same tag waits its turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=2g -Xmx6g"

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            gradlew: ./gradlew
            task: linkReleaseExecutableLinuxX64
            binary: build/bin/linuxX64/releaseExecutable/plexify.kexe
            asset: linux-x64
            runnable: true
          # Cross-compiled on x64: the binary cannot be run here, only built.
          - name: Linux arm64
            os: ubuntu-latest
            gradlew: ./gradlew
            task: linkReleaseExecutableLinuxArm64
            binary: build/bin/linuxArm64/releaseExecutable/plexify.kexe
            asset: linux-arm64
            runnable: false
          - name: Windows x64
            os: windows-latest
            gradlew: ./gradlew.bat
            task: linkReleaseExecutableWindows
            binary: build/bin/windows/releaseExecutable/plexify.exe
            asset: windows-x64
            runnable: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up build
        uses: ./.github/actions/setup-build

      # The TMDB credentials are built into release binaries as the fallback key, used
      # when the user sets none of their own (see TmdbCredentials). Anyone can extract a
      # key from a binary, so this is a shared key that TMDB may revoke: users can always
      # override it with TMDB_API_ACCESS_TOKEN. Empty secrets build a binary without one.
      - name: Build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_ACCESS_TOKEN: ${{ secrets.TMDB_API_ACCESS_TOKEN }}
        run: ${{ matrix.gradlew }} ${{ matrix.task }} --no-daemon --no-parallel --stacktrace

      # The version is baked in from `git describe`; a binary that does not report
      # exactly this tag was built from the wrong commit or without the tag. Only the
      # first line is compared.
      - name: Check the binary reports the tag version
        if: matrix.runnable
        shell: bash
        run: |
          version="$("${{ matrix.binary }}" --version | head -n1 | tr -d '\r')"
          echo "$version"
          if [[ "$version" != *" $GITHUB_REF_NAME" ]]; then
            echo "::error::Binary reports '$version', expected version $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" dist/plexify
          tar -czf "dist/plexify-${GITHUB_REF_NAME}-${{ matrix.asset }}.tar.gz" -C dist plexify

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "${{ matrix.binary }}" dist/plexify.exe
          Compress-Archive -Path dist/plexify.exe -DestinationPath "dist/plexify-$env:GITHUB_REF_NAME-${{ matrix.asset }}.zip"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # Gemini writes the notes by following the release-notes skill, then the validator,
  # run as its own step, decides whether they are usable. If anything here fails the
  # release still ships, with GitHub's generated notes instead (see the release job),
  # so the job is allowed to fail without failing the run.
  notes:
    name: Write release notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    # Read-only on purpose: the model reads commit messages anyone could have written
    # in a pull request, so this job holds no token that can change the repository.
    permissions:
      contents: read
    # Headless Gemini CLI refuses to run in a folder it has not been told to trust,
    # and in an untrusted folder it would also ignore .gemini/settings.json, which
    # holds the tools.core allowlist below. The checkout is this repo at a tag cut
    # from reviewed main, so trusting it is what we want.
    env:
      GEMINI_CLI_TRUST_WORKSPACE: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the log and diff of the whole range
          persist-credentials: false

      # The base is the preceding tag. A tag that was pushed but whose release was
      # deleted would have its changes described there and omitted here; acceptable
      # for a project where every tag is a release.
      - name: Resolve the release range
        id: range
        run: |
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            echo "::error::No tag precedes $GITHUB_REF_NAME, so there is no range to describe."
            exit 1
          fi
          echo "Release notes for ${previous}..${GITHUB_REF_NAME}"
          echo "from=$previous" >> "$GITHUB_OUTPUT"

      # The action runs Gemini CLI with --yolo, so every tool call is auto-approved.
      # tools.core is what keeps that safe: it is an allowlist, the CLI denies every
      # tool not on it, and shell access is limited to read-only git commands and the
      # validator. The CLI version and the model are pinned so neither can change how
      # a release run behaves on the day a tag is pushed; Dependabot bumps the action
      # but not these two inputs. gemini-3.8-flash already thinks at HIGH (the top
      # level) by default; the modelConfigs override pins it, so a CLI default change
      # cannot quietly lower it.
      - name: Generate release notes
        timeout-minutes: 10
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: 0.63.0
          gemini_model: gemini-3.8-flash
          settings: |
            {
              "privacy": { "usageStatisticsEnabled": false },
              "modelConfigs": {
                "customOverrides": [
                  {
                    "match": { "model": "gemini-3.8-flash" },
                    "modelConfig": {
                      "generateContentConfig": {
                        "thinkingConfig": { "thinkingLevel": "HIGH" }
                      }
                    }
                  }
                ]
              },
              "tools": {
                "core": [
                  "read_file",
                  "write_file",
                  "replace",
                  "glob",
                  "grep_search",
                  "list_directory",
                  "run_shell_command(git log)",
                  "run_shell_command(git diff)",
                  "run_shell_command(git show)",
                  "run_shell_command(git tag)",
                  "run_shell_command(./scripts/validate-release-notes.sh)"
                ]
              }
            }
          prompt: |
            Read .claude/skills/release-notes/SKILL.md and follow it in non-interactive
            CI mode. No human is present: never ask a question, and never end your turn
            on a failure without acting on it.

            Range: ${{ steps.range.outputs.from }}..${{ github.ref_name }}
            Version: ${{ github.ref_name }}
            Formats: GitHub only
            Output: file mode, writing the GitHub notes to release_notes/github.md and
            nothing else.

            Then run this and act on what it reports:
              ./scripts/validate-release-notes.sh release_notes/github.md ${{ steps.range.outputs.from }} ${{ github.ref_name }}

            Correct what it names and run it again, up to 5 attempts, until it exits 0.
            CI runs the same validator afterwards and discards notes that fail it, so
            there is nothing to gain by stopping early.

      # Run by the pipeline, not by the generator: the thing being checked never
      # decides whether it passed.
      - name: Validate release notes
        env:
          FROM: ${{ steps.range.outputs.from }}
        run: ./scripts/validate-release-notes.sh release_notes/github.md "$FROM" "$GITHUB_REF_NAME"

      # Uploaded only after validation passes, so the release job can treat "the
      # artifact exists" as "the notes are usable".
      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release_notes/github.md
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub release
    needs: [build, notes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Download release notes
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release_notes

      - name: Check the built-in TMDB key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_ACCESS_TOKEN: ${{ secrets.TMDB_API_ACCESS_TOKEN }}
        run: |
          if [ -z "$TMDB_API_KEY$TMDB_API_ACCESS_TOKEN" ]; then
            msg="No TMDB_API_ACCESS_TOKEN or TMDB_API_KEY secret: these binaries have no built-in key, so every user must set their own."
            echo "::warning title=No built-in TMDB key::$msg"
            echo "> [!WARNING]"$'\n'"> $msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist
          if [ -s release_notes/github.md ]; then
            notes=(--notes-file release_notes/github.md)
          else
            msg="Gemini could not write the release notes, so GitHub generated them. See the 'Write release notes' job, then edit the release."
            echo "::warning title=Release notes fell back::$msg"
            echo "> [!WARNING]"$'\n'"> $msg" >> "$GITHUB_STEP_SUMMARY"
            notes=(--generate-notes)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A rerun after the release already exists: refresh the binaries and keep
            # the notes, which may have been edited by hand since.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --verify-tag "${notes[@]}"
          fi
