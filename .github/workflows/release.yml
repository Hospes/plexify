name: Build and Release

# This workflow is triggered only when a new release is published.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Jobs to build Linux executables (x64 and arm64 run in parallel via matrix)
  build-linux:
    name: Build for Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            gradle_task: linkReleaseExecutableLinuxX64
            bin_dir: linuxX64
          - arch: arm64
            gradle_task: linkReleaseExecutableLinuxArm64
            bin_dir: linuxArm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Releases are the only workflow in this repo, so they must be allowed
          # to write the cache — otherwise it never gets populated and every
          # build starts cold.
          cache-read-only: false

      # The Kotlin/Native toolchain (LLVM, sysroots, ...) lives outside the
      # Gradle User Home and is re-downloaded on every cold run without this.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Build with Gradle
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=2g -Xmx6g"
        run: ./gradlew ${{ matrix.gradle_task }} --no-daemon --no-parallel --stacktrace

      - name: Package the executable
        run: |
          STAGING_DIR="build/dist"
          mkdir -p "$STAGING_DIR"
          cp build/bin/${{ matrix.bin_dir }}/releaseExecutable/plexify.kexe "$STAGING_DIR/plexify"
          tar -czf "$STAGING_DIR/plexify-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz" -C "$STAGING_DIR" plexify

      - name: List files in build directory
        run: ls -R build/dist

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "build/dist/plexify-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz"
          --clobber

  # Job to build the Windows executable
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Build with Gradle
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=2g -Xmx6g"
        run: ./gradlew.bat linkReleaseExecutableWindows --no-daemon --no-parallel --stacktrace

      - name: Package the executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/dist | Out-Null
          Copy-Item build/bin/windows/releaseExecutable/plexify.exe build/dist/plexify.exe
          Compress-Archive -Path build/dist/plexify.exe -DestinationPath "build/dist/plexify-${{ github.ref_name }}-windows-x64.zip"

      - name: List files in build directory
        run: ls -R build/dist

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "build/dist/plexify-${{ github.ref_name }}-windows-x64.zip"
          --clobber
