name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes its previous run pointless. Runs on main always
# finish, so every merged commit gets a result and seeds the caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=2g -Xmx6g"

jobs:
  # Job names are required status checks in the "main – safety" ruleset:
  # renaming one means updating the ruleset too.
  linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up build
        id: setup
        uses: ./.github/actions/setup-build

      # Tests are native binaries; linuxX64Test covers all commonMain logic. arm64
      # cannot run on this runner, but linking its test binary catches link-time
      # failures (like the Clikt duplicate symbol) before a release does.
      - name: Run tests
        run: ./gradlew linuxX64Test linkDebugTestLinuxArm64 --no-daemon --stacktrace

      - name: Save Kotlin/Native toolchain
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.konan-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.setup.outputs.konan-key }}

  # Windows has its own platform code (hardlinks via Win32) and its own linker,
  # so a Windows-only break must surface here, not after a release tag.
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up build
        id: setup
        uses: ./.github/actions/setup-build

      - name: Run tests
        run: ./gradlew.bat windowsTest --no-daemon --stacktrace

      - name: Save Kotlin/Native toolchain
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.konan-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.setup.outputs.konan-key }}
